services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=logs
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

      # ⚠️ MANDATORY: Real Polygon Layer 2 Blockchain Credentials Required
      # Get RPC URL from: https://www.alchemy.com/polygon or https://infura.io/
      # Deploy smart contract to Polygon and set contract address
      # Export your Ethereum wallet private key (keep secure!)
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-REPLACE_WITH_REAL_RPC_URL}
      - BLOCKCHAIN_ENABLED=true
      - BLOCKCHAIN_CONTRACT_ADDRESS=${BLOCKCHAIN_CONTRACT_ADDRESS:-REPLACE_WITH_DEPLOYED_CONTRACT}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY:-REPLACE_WITH_WALLET_PRIVATE_KEY}
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9003:9001" # Web UI (changed to 9003)
      - "9002:9000" # API
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
  minio_data:
